name: Release

# Push a tag like v0.9.0 to build the zip and publish it.
# GitHub Releases always works. CurseForge and Wago only upload when their secrets are set
# (Settings > Secrets and variables > Actions: CF_API_KEY, WAGO_API_TOKEN) and the toc has
# ## X-Curse-Project-ID and ## X-Wago-ID filled in.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
